name: CI

# No paths filter: in this repo every change is a plugin change. The push
# trigger is on because this repo is the plugin - there is no larger tree whose
# CI would catch a bad main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # `make` and not raw cmake, because `make test` is what the release Gate
      # runs. This job used to drive cmake directly with the right --config/-C
      # flags while the Makefile had neither, so the Makefile path reached a tag
      # having never run on Windows - where it configured a multi-config
      # generator, built Debug, looked for Release, and reported all 11 tests
      # "Not Run" as a pass. CI must run the command the release runs.
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Test
        run: make test

  plugin-build:
    name: X-Plane plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # The release build uses MinGW on Windows. Building MSVC here would leave
      # the toolchain that actually ships proven only at tag time.
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install make mingw -y

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build plugin
        shell: bash
        run: make plugin
