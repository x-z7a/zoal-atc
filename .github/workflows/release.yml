name: Release

permissions:
  contents: write
  actions: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package and publish with the current workflow'
        required: false
        type: string

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-24.04
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Create or reuse release
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(mktemp)"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets,isDraft > "${release_json}"; then
            is_draft="$(jq -r '.isDraft' "${release_json}")"
            package_assets="$(jq '[.assets[]?.name | select(test("^zoal-atc-.*\\.zip$"))] | length' "${release_json}")"

            if [ "${is_draft}" != "true" ] && [ "${package_assets}" -gt 0 ]; then
              echo "::error::Release ${RELEASE_TAG} is already published with package assets; refusing to overwrite it."
              exit 1
            fi

            echo "Using existing release ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
            gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets,isDraft > "${release_json}"
          fi

          mapfile -t stale_assets < <(
            jq -r '.assets[]?.name | select(test("^zoal-atc-.*\\.zip$"))' "${release_json}"
          )

          if [ ${#stale_assets[@]} -eq 0 ]; then
            echo "No stale package assets to delete"
            exit 0
          fi

          printf 'Deleting %s stale package assets\n' "${#stale_assets[@]}"
          for asset in "${stale_assets[@]}"; do
            gh release delete-asset "${RELEASE_TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}" --yes
          done

  package:
    name: Package (${{ matrix.os }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    if: ${{ always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    # Whether the Apple signing and notarization secrets are available here,
    # read once so a step's condition can ask (a step's if cannot read secrets).
    env:
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.CODESIGN_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.CODESIGN_IDENTITY != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # No Go and no Node: packaging archives with `cmake -E tar`, and cmake
      # is already a hard dependency of the plugin build on all three
      # platforms. The panel is C++ now, built with the plugin.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvulkan-dev glslc spirv-headers

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install make mingw -y

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Whisper's Vulkan backend (x-z7a/zoal-atc#66) needs the Vulkan headers,
      # the loader's import library and glslc to compile its shaders. MinGW
      # links the LunarG SDK's vulkan-1.lib directly; nothing from the SDK is
      # shipped, because the driver X-Plane already needs installs the loader.
      - name: Install the Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.313.2
        run: |
          curl.exe -fsSL -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$env:VULKAN_VERSION\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Tag-time quality used to rest entirely on the PR-time CI workflow: this
      # job went straight from checkout to packaging, so a tag pushed from a
      # branch that never opened a PR shipped unproven.
      #
      - name: Test
        shell: bash
        run: make test

      # The models ship in every package: ~560MB fetched once per pin rather
      # than on every tag.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('scripts/ensure-models.sh') }}

      # macOS: a Developer ID signature on the .xpl and a notarized package,
      # as zoal-honeycomb ships, so Gatekeeper loads the plugin without the
      # pilot having to clear its quarantine by hand. Without the signing
      # secrets (a fork, a repository they are not shared with) the package
      # is built as before and the run says so.
      - name: Import Apple code signing certificate
        if: ${{ runner.os == 'macOS' && env.HAS_SIGNING == 'true' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Package release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZOAL_ATC_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          CODESIGN_IDENTITY: ${{ runner.os == 'macOS' && env.HAS_SIGNING == 'true' && secrets.CODESIGN_IDENTITY || '' }}
        run: |
          if [ "${RUNNER_OS}" = "macOS" ] && [ -z "${CODESIGN_IDENTITY}" ]; then
            echo "::warning::No CODESIGN_IDENTITY secret: the macOS plugin is not Developer ID signed"
          fi
          make archive-plugin CODESIGN_IDENTITY="${CODESIGN_IDENTITY}"

      - name: Notarize macOS package
        if: ${{ runner.os == 'macOS' && env.HAS_NOTARY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          package="$(ls dist/zoal-atc-*.zip)"
          xcrun notarytool submit "${package}" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.MAC_DEV_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAMID }}" \
            --wait

      - name: Upload package to release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          packages=()
          for package in dist/zoal-atc-*.zip; do
            [ -e "${package}" ] || continue
            packages+=("${package}")
          done

          if [ ${#packages[@]} -ne 1 ]; then
            printf 'Expected one package, found %s:\n' "${#packages[@]}" >&2
            printf '  %s\n' "${packages[@]}" >&2
            exit 1
          fi

          gh release upload "${RELEASE_TAG}" "${packages[0]}" --repo "${GITHUB_REPOSITORY}" --clobber

      - uses: actions/upload-artifact@v4
        if: ${{ !(startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
        with:
          name: zoal-atc-${{ runner.os }}
          path: dist/zoal-atc-*.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare-release, package]
    runs-on: ubuntu-24.04
    if: ${{ always() && needs.prepare-release.result == 'success' && needs.package.result == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[]?.name | select(test("^zoal-atc-.*\\.zip$"))'
          )

          printf 'Release package assets:\n'
          printf '  %s\n' "${assets[@]}"

          if [ ${#assets[@]} -ne 3 ]; then
            echo "::error::Expected 3 release package assets, found ${#assets[@]}"
            exit 1
          fi

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json databaseId \
              --jq '.databaseId'
          )"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f draft=false

  prune-releases:
    name: Prune old releases
    needs: publish
    runs-on: ubuntu-24.04
    if: ${{ needs.publish.result == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Delete releases older than the latest 5
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags < <(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq 'map(select((.draft | not) and (.prerelease | not))) | sort_by(.created_at) | reverse | .[5:][]?.tag_name'
          )

          if [ ${#tags[@]} -eq 0 ]; then
            echo "No old releases to prune"
            exit 0
          fi

          printf 'Deleting %s old releases\n' "${#tags[@]}"
          for tag in "${tags[@]}"; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done

  cleanup-staged-release:
    name: Delete staged release assets
    needs: [prepare-release, package, publish]
    runs-on: ubuntu-24.04
    if: ${{ always() && needs.prepare-release.result == 'success' && needs.publish.result != 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Delete partially uploaded package assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[]?.name | select(test("^zoal-atc-.*\\.zip$"))'
          )

          if [ ${#assets[@]} -gt 0 ]; then
            printf 'Deleting %s staged package assets\n' "${#assets[@]}"
            for asset in "${assets[@]}"; do
              gh release delete-asset "${RELEASE_TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}" --yes
            done
          fi

          is_draft="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft \
              --jq '.isDraft'
          )"

          if [ "${is_draft}" = "true" ]; then
            gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --yes
          fi

  # Skunkcrafts Updater, as zoal-honeycomb publishes it: the plugin's files on
  # the `release` branch with a CRC32 whitelist, which an installed copy's
  # skunkcrafts_updater.cfg points at. The three platform packages are merged
  # into one tree, the way a pilot who flies on two machines installs it.
  #
  # The models are left out. Whisper's and Kokoro's files are each over
  # GitHub's 100MB limit for a file in a branch, they change far less often
  # than the plugin, and a file the whitelist does not name is one the updater
  # leaves alone: a pilot installs them once from the release zip, and the
  # updater keeps the plugin, its runtime and its fonts current.
  updater:
    name: Publish Skunkcrafts Updater branch
    needs: [publish]
    runs-on: ubuntu-24.04
    if: ${{ needs.publish.result == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Merge the platform packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages merged
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'zoal-atc-*.zip' --dir packages
          for package in packages/*.zip; do
            unzip -q -o "${package}" -d merged
          done
          rm -rf merged/zoal-atc/models
          sed "s/REPLACE_ME/${RELEASE_TAG}/g" skunkcrafts_updater.cfg > merged/zoal-atc/skunkcrafts_updater.cfg
          printf '%s\n' "${RELEASE_TAG}" > "merged/zoal-atc/${RELEASE_TAG}"
          ls -la merged/zoal-atc

      - name: Write the whitelist
        shell: bash
        run: |
          set -euo pipefail
          cd merged/zoal-atc
          rm -f skunkcrafts_updater_whitelist.txt
          python3 - <<'PY'
          import os, zlib
          lines = []
          for root, _, files in os.walk("."):
              for name in files:
                  path = os.path.relpath(os.path.join(root, name), ".")
                  if "skunkcrafts_updater" in path:
                      continue
                  with open(path, "rb") as f:
                      lines.append("%s|%d" % (path.replace(os.sep, "/"), zlib.crc32(f.read()) & 0xffffffff))
          with open("skunkcrafts_updater_whitelist.txt", "w") as out:
              out.write("\n".join(sorted(lines)) + "\n")
          PY
          touch skunkcrafts_updater_blacklist.txt
          wc -l skunkcrafts_updater_whitelist.txt

      - name: Push the release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan release
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name merged -exec rm -rf {} +
          mv merged/zoal-atc release
          rm -rf merged
          git add release
          git commit -qm "release ${RELEASE_TAG}"
          git push -f origin release
